<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">
<title>Loading</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
}
body {
  color: white;
}
/* =========================
   PANTALLA
========================= */
.loading-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(
      circle at 50% 45%,
      #181818 0%,
      #0b0b0b 35%,
      #050505 70%,
      #000 100%
    );
}
/* =========================
   CONTENEDOR
========================= */
.loader-wrapper {
  width: min(82vw, 340px);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
/* =========================
   ORBITAL LOADER
========================= */
.orbit {
  position: relative;
  width: 100px;
  height: 100px;
  margin-bottom: 34px;
}
/* Anillo principal */
.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.10);
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.025),
    0 0 30px rgba(255,255,255,.025);
}
/* Segundo anillo */
.ring::before {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.06);
}
/* Anillo giratorio */
.spinner {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: rgba(255,255,255,.95);
  border-right-color: rgba(255,255,255,.25);
  animation:
    rotate 1.15s cubic-bezier(.65,0,.35,1) infinite;
  filter:
    drop-shadow(0 0 7px rgba(255,255,255,.25));
}
/* Punto orbital */
.orbital-dot {
  position: absolute;
  width: 8px;
  height: 8px;
  top: -4px;
  left: 50%;
  margin-left: -4px;
  border-radius: 50%;
  background: #fff;
  box-shadow:
    0 0 8px rgba(255,255,255,.8),
    0 0 18px rgba(255,255,255,.25);
  animation:
    rotate 1.15s cubic-bezier(.65,0,.35,1) infinite;
}
/* Centro */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 7px;
  height: 7px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #fff;
  box-shadow:
    0 0 12px rgba(255,255,255,.7);
  animation: pulse 1.8s ease-in-out infinite;
}
/* =========================
   TEXTO
========================= */
.status {
  height: 23px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .2px;
  color: rgba(255,255,255,.92);
}
.status span {
  display: inline-block;
  width: 18px;
  text-align: left;
}
/* =========================
   PORCENTAJE
========================= */
.percent {
  margin-top: 8px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
  color: rgba(255,255,255,.38);
}
/* =========================
   BARRA
========================= */
.progress-track {
  position: relative;
  width: 100%;
  height: 2px;
  margin-top: 25px;
  overflow: hidden;
  border-radius: 10px;
  background: rgba(255,255,255,.08);
}
.progress-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 35%;
  height: 100%;
  border-radius: inherit;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.95),
      transparent
    );
  animation:
    progress 1.8s cubic-bezier(.65,0,.35,1) infinite;
}
/* =========================
   SUBTEXTO
========================= */
.hint {
  margin-top: 18px;
  font-size: 11px;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: rgba(255,255,255,.20);
}
/* =========================
   ANIMACIONES
========================= */
@keyframes rotate {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
@keyframes pulse {
  0%,
  100% {
    transform:
      translate(-50%, -50%)
      scale(.8);
    opacity: .55;
  }
  50% {
    transform:
      translate(-50%, -50%)
      scale(1.25);
    opacity: 1;
  }
}
@keyframes progress {
  0% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(390%);
  }
}
/* =========================
   RESPETAR REDUCCIÓN
========================= */
@media (prefers-reduced-motion: reduce) {
  .spinner,
  .orbital-dot,
  .center,
  .progress-bar {
    animation-duration: 3s;
  }
}
</style>
</head>
<body>
<div class="loading-screen">
  <div class="loader-wrapper">
    <div class="orbit">
      <div class="ring"></div>
      <div class="spinner"></div>
      <div class="orbital-dot"></div>
      <div class="center"></div>
    </div>
    <div class="status">
      <span id="statusText">Inicializando</span>
      <span id="dots"></span>
    </div>
    <div class="percent">
      <span id="percent">0</span>%
    </div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <div class="hint">
      Please wait
    </div>
  </div>
</div>
<script>
const statusText = document.getElementById("statusText");
const dots = document.getElementById("dots");
const percent = document.getElementById("percent");
const messages = [
  "Inicializando",
  "Preparando",
  "Cargando recursos",
  "Sincronizando",
  "Verificando",
  "Conectando",
  "Finalizando"
];
let progress = 0;
let messageIndex = 0;
let dotCount = 0;
/* Porcentaje infinito */
setInterval(() => {
  progress++;
  if (progress > 100) {
    progress = 0;
  }
  percent.textContent = progress;
}, 55);
/* Cambiar mensajes */
setInterval(() => {
  messageIndex++;
  if (messageIndex >= messages.length) {
    messageIndex = 0;
  }
  statusText.textContent = messages[messageIndex];
}, 1600);
/* Animación de puntos */
setInterval(() => {
  dotCount++;
  if (dotCount > 3) {
    dotCount = 0;
  }
  dots.textContent = ".".repeat(dotCount);
}, 400);
/*
  La página permanece indefinidamente
  en estado de carga.
*/
</script>
</body>
</html>
