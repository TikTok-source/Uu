<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
<title>Cargando...</title>
<!-- ICONO -->
<link rel="icon" type="image/png" href="./icon.png.PNG">
<link rel="apple-touch-icon" href="./icon.png.PNG">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* PANTALLA */
.loading-screen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(
            circle at center,
            #191919 0%,
            #0a0a0a 45%,
            #000000 100%
        );
}
/* CONTENEDOR */
.loader {
    width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
/* ZONA DEL ICONO */
.logo-area {
    position: relative;
    width: 130px;
    height: 130px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 35px;
}
/* ANILLO */
.ring {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #ffffff;
    border-right-color: rgba(255,255,255,.25);
    animation:
        spin 1.1s linear infinite;
    filter:
        drop-shadow(
            0 0 8px
            rgba(255,255,255,.25)
        );
}
/* SEGUNDO ANILLO */
.ring-2 {
    position: absolute;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    border: 1px solid
        rgba(255,255,255,.10);
    animation:
        reverseSpin 2.2s linear infinite;
}
/* ICONO */
.logo {
    position: relative;
    width: 72px;
    height: 72px;
    object-fit: contain;
    border-radius: 18px;
    z-index: 10;
    animation:
        logoPulse 2s ease-in-out infinite;
    filter:
        drop-shadow(
            0 0 18px
            rgba(255,255,255,.12)
        );
}
/* TEXTO */
.loading-text {
    min-height: 24px;
    color: rgba(255,255,255,.92);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: .2px;
}
.dots {
    display: inline-block;
    width: 20px;
    text-align: left;
}
/* PORCENTAJE */
.percent {
    margin-top: 8px;
    color: rgba(255,255,255,.35);
    font-size: 12px;
    letter-spacing: 1px;
    font-variant-numeric:
        tabular-nums;
}
/* BARRA */
.progress-container {
    position: relative;
    width: 220px;
    height: 3px;
    margin-top: 25px;
    overflow: hidden;
    border-radius: 20px;
    background:
        rgba(255,255,255,.08);
}
.progress {
    position: absolute;
    top: 0;
    left: -40%;
    width: 40%;
    height: 100%;
    border-radius: 20px;
    background: #ffffff;
    box-shadow:
        0 0 10px
        rgba(255,255,255,.5);
    animation:
        progressMove 1.5s
        ease-in-out infinite;
}
/* SUBTEXTO */
.subtext {
    margin-top: 17px;
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color:
        rgba(255,255,255,.20);
}
/* ANIMACIONES */
@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}
@keyframes reverseSpin {
    from {
        transform: rotate(360deg);
    }
    to {
        transform: rotate(0deg);
    }
}
@keyframes logoPulse {
    0%,
    100% {
        transform: scale(.96);
    }
    50% {
        transform: scale(1.04);
    }
}
@keyframes progressMove {
    0% {
        left: -40%;
    }
    100% {
        left: 110%;
    }
}
</style>
</head>
<body>
<div class="loading-screen">
    <div class="loader">
        <!-- ICONO + CARGA -->
        <div class="logo-area">
            <div class="ring"></div>
            <div class="ring-2"></div>
            <img
                class="logo"
                src="./icon.png.PNG"
                alt="Icono"
            >
        </div>
        <!-- TEXTO -->
        <div class="loading-text">
            <span id="message">
                Cargando
            </span>
            <span
                class="dots"
                id="dots">
            </span>
        </div>
        <!-- PORCENTAJE -->
        <div class="percent">
            <span id="percent">0</span>%
        </div>
        <!-- BARRA -->
        <div class="progress-container">
            <div class="progress"></div>
        </div>
        <div class="subtext">
            Please wait
        </div>
    </div>
</div>
<script>
const message =
    document.getElementById("message");
const dots =
    document.getElementById("dots");
const percent =
    document.getElementById("percent");
const messages = [
    "Cargando",
    "Preparando",
    "Conectando",
    "Verificando",
    "Sincronizando",
    "Inicializando"
];
let number = 0;
let messageIndex = 0;
let dotNumber = 0;
/* PORCENTAJE INFINITO */
setInterval(() => {
    number++;
    if (number > 100) {
        number = 0;
    }
    percent.textContent = number;
}, 55);
/* CAMBIO DE TEXTO */
setInterval(() => {
    messageIndex++;
    if (
        messageIndex >=
        messages.length
    ) {
        messageIndex = 0;
    }
    message.textContent =
        messages[messageIndex];
}, 1700);
/* PUNTOS */
setInterval(() => {
    dotNumber++;
    if (dotNumber > 3) {
        dotNumber = 0;
    }
    dots.textContent =
        ".".repeat(dotNumber);
}, 400);
</script>
</body>
</html>
