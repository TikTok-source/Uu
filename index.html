<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cargando...</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
    }

    .loading-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #e5e5e5;
      border-top-color: #111111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .text {
      margin-top: 18px;
      font-size: 16px;
      color: #333333;
      letter-spacing: 0.2px;
    }

    .dots::after {
      content: "";
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
      100% { content: ""; }
    }
  </style>
</head>

<body>

  <main class="loading-screen">
    <div class="spinner"></div>

    <div class="text">
      Cargando<span class="dots"></span>
    </div>
  </main>

  <script>
    // Mantiene la página en estado de carga indefinidamente.
    // No se realiza ninguna redirección ni se muestra contenido adicional.

    window.addEventListener("load", () => {
      // La animación continúa indefinidamente.
    });
  </script>

</body>
</html>
